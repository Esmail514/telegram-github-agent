name: CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  code-quality:
    name: Code Quality & Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint
        run: ruff check . --output-format=github

      - name: Validate Skills Architecture
        run: python .agents/skills/skill-maintainer/scripts/validate_skills.py

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mypy
        run: python -m mypy app

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Verify Git Hygiene & Secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/ci_check_secrets.py --check-diff --base-ref "${{ github.base_ref }}"
          else
            python scripts/ci_check_secrets.py
          fi

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          pip-audit --desc on || echo "::warning::pip-audit reported dependency advisories"

  config-and-build:
    name: Config Sanity & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . build twine

      - name: Verify Application Configuration Sanity
        env:
          TELEGRAM_BOT_TOKEN: "000000000:dummy_ci_token_for_verification"
          TELEGRAM_ALLOWED_USER_ID: "123456789"
          GITHUB_TOKEN: "ghp_dummytokenfortestingpurposes12345"
        run: |
          python -m app.main --check-config

      - name: Build Package Distribution (Wheel & Sdist)
        run: |
          python -m build

      - name: Validate Package Metadata
        run: |
          twine check dist/*

  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Run 3.11 & 3.12 on Linux; run 3.11 on Windows for OS-specific validation
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite with Coverage
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload Coverage Artifact (Linux Py 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py311
          path: coverage.xml
          retention-days: 14

  ci-gate:
    name: CI Status Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-quality
      - type-check
      - security
      - config-and-build
      - test
    steps:
      - name: Check All Job Results
        run: |
          echo "### CI Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality & Skills | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check (Mypy) | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security & Secrets | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Config & Build | ${{ needs.config-and-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Matrix Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          RESULTS="${{ needs.code-quality.result }} ${{ needs.type-check.result }} ${{ needs.security.result }} ${{ needs.config-and-build.result }} ${{ needs.test.result }}"
          if echo "$RESULTS" | grep -E -q '(failure|cancelled)'; then
            echo "::error::One or more upstream CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI checks completed successfully!"
